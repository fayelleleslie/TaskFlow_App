name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0
        ports: ['27017:27017']
      redis:
        image: redis:7
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Wait for MongoDB
        run: |
          sudo apt-get update
          sudo apt-get install -y netcat
          for i in {1..30}; do nc -z localhost 27017 && echo 'Mongo up' && break || sleep 1; done

      - name: Backend tests
        working-directory: Backend
        env:
          MONGO_URI: mongodb://localhost:27017/taskflow_test
          JWT_SECRET: testsecret
          NODE_ENV: test
        run: |
          npm ci || npm install
          npm run test:smoke
